name: Docs

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
      - name: Build MkDocs site
        run: mkdocs build --strict
      - name: Add job summary (build)
        if: ${{ success() }}
        run: |
          REPO='${{ github.repository }}'
          {
            echo "### Docs Build";
            echo "- Repository: ${REPO}";
            echo "- Status: built";
            echo "- Deployment: skipped (GitHub Pages disabled)";
          } >> "$GITHUB_STEP_SUMMARY"
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
      - name: Build MkDocs site
        run: mkdocs build --strict
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
      - name: Add job summary (preview)
        run: |
          echo "### Docs Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: docs-site" >> "$GITHUB_STEP_SUMMARY"
